<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111e"><title>دخول الإدارة — أويس تك</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin-login.css"></head>
<body class="admin-auth-page">
<main class="admin-login-screen">
<section class="admin-login-shell" aria-labelledby="login-title">
<aside class="admin-login-intro"><a class="admin-auth-brand" href="/" dir="ltr">OWAYS <span>TECH</span></a><div class="admin-intro-art" aria-hidden="true"><div class="admin-art-ring"></div><div class="admin-art-core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></div><i></i><i></i></div><div class="admin-intro-copy"><span class="admin-auth-kicker">مساحة الإدارة</span><h2>كل خدماتك،<br>في مكان واحد.</h2><p>تابع الطلبات ونظّم الخدمات وتواصل مع عملائك بسهولة.</p></div><span class="admin-intro-footer">أويس تك · خدمات رقمية متكاملة</span></aside>
<div class="admin-login-card">
<a class="admin-auth-brand admin-mobile-brand" href="/" dir="ltr">OWAYS <span>TECH</span></a>
<div class="admin-login-heading"><span class="admin-login-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><span class="admin-auth-kicker">مرحبًا بعودتك</span><h1 id="login-title">دخول لوحة الإدارة</h1><p>أدخل بيانات حسابك للمتابعة.</p></div>
<form id="admin-login-form">
<div class="admin-auth-field"><label for="admin-username">اسم المستخدم</label><div class="admin-auth-input"><span class="admin-field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><input id="admin-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required placeholder="oways_admin" minlength="3" maxlength="64"></div></div>
<div class="admin-auth-field"><label for="admin-password">كلمة المرور</label><div class="admin-auth-input"><span class="admin-field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></span><input id="admin-password" name="password" type="password" autocomplete="current-password" dir="ltr" required maxlength="128" placeholder="أدخل كلمة المرور"><button class="admin-password-toggle" type="button" id="toggle-password" aria-label="إظهار كلمة المرور" aria-pressed="false" aria-controls="admin-password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<label class="admin-remember"><input name="remember" type="checkbox"><span>تذكّرني على هذا الجهاز</span></label>
<p id="login-feedback" role="alert" hidden></p>
<button class="admin-login-submit" type="submit"><span id="login-button-label">تسجيل الدخول</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
</form>
<a href="/" class="admin-back-link">العودة إلى الموقع <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></a>
</div>
</section>
</main>
<script type="module" src="admin-login.js"></script>
</body></html>
