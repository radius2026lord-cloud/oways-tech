<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة أويس تك</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="portal.css"></head><body><header><div class="wrap nav"><a class="brand" href="/">OWAYS <span class="cyan">TECH</span></a><a href="/account">حسابي ←</a></div></header><main class="wrap section"><h1 class="portal-title">لوحة إدارة أويس تك</h1><p id="status" role="status"></p><div id="admin-content" hidden><div class="portal-tabs"><button class="button" data-tab="orders">الطلبات</button><button class="button outline" data-tab="catalog">الخدمات والتصنيفات</button></div><section id="orders-tab"><div id="orders" class="portal-list section"></div><div id="order-detail" class="portal-panel" hidden></div></section><section id="catalog-tab" hidden><div class="portal-grid"><section class="portal-panel"><h2>إضافة تصنيف</h2><form id="category-form"><label>الاسم<input name="name" required maxlength="160"></label><label>المعرّف الإنكليزي<input name="slug" required pattern="[a-z][a-z0-9-]*" dir="ltr"></label><label>الوصف<textarea name="description"></textarea></label><button class="button">حفظ التصنيف</button></form><div id="categories"></div></section><section class="portal-panel"><h2>إضافة خدمة وباقتها الأولى</h2><form id="service-form"><label>التصنيف<select name="category_id" id="category-select" required></select></label><label>اسم الخدمة<input name="name" required></label><label>المعرّف الإنكليزي<input name="slug" required pattern="[a-z][a-z0-9-]*" dir="ltr"></label><label>الوصف<textarea name="description" required></textarea></label><label>النوع<select name="kind"><option value="subscription">اشتراك</option><option value="one_time">خدمة لمرة واحدة</option></select></label><label>اسم الباقة<input name="package_name" required></label><div class="portal-grid"><label>التسعير<select name="pricing_mode"><option value="fixed">سعر ثابت</option><option value="quote">عرض سعر</option></select></label><label>السعر<input name="price" type="number" min="0" step="0.01"></label><label>العملة<input name="currency" value="USD" required pattern="[A-Z]{3}" dir="ltr"></label><label>قيمة المدة<input name="duration_value" type="number" min="1" value="1"></label></div><label>وحدة المدة<select name="duration_unit"><option value="month">شهر</option><option value="day">يوم</option><option value="week">أسبوع</option><option value="year">سنة</option></select></label><label>طريقة التنفيذ<input name="activation_method" value="تنفيذ بمساعدة الدعم" required></label><label>المميزات، ميزة في كل سطر<textarea name="features"></textarea></label><h3>متطلبات العميل</h3><div id="requirements"></div><button type="button" id="add-requirement" class="button outline">إضافة حقل +</button><label>تعليمات قبل الطلب<textarea name="before_order"></textarea></label><label>تعليمات أثناء التفعيل<textarea name="during_activation"></textarea></label><label>تعليمات بعد الاكتمال<textarea name="after_completion"></textarea></label><button class="button">حفظ الخدمة والباقة</button></form></section></div><h2>الخدمات المضافة</h2><div id="services" class="portal-list"></div></section></div></main><script src="api.js"></script><script src="admin.js"></script><script src="account-widget.js"></script></body></html>
